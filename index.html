<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix - Final Exact Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #7b52fb 0%, #a285ff 50%, #c4aef2 100%); }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* واجهة المستخدم المطابقة للفيديو */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px; background-color: #8375f2;
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .score-pill {
            background: white; color: #333; padding: 6px 18px; border-radius: 20px;
            font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px;
        }
        .icons-right { display: flex; gap: 10px; }
        .icon-circle {
            width: 35px; height: 35px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 18px; color: #8375f2;
        }

        #level-ui {
            position: absolute; top: 75px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none;
        }
        .level-progress { display: flex; align-items: center; gap: 10px; }
        .diamond {
            width: 25px; height: 25px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 14px; transform: rotate(45deg);
        }
        .diamond span { transform: rotate(-45deg); }
        .diamond.current { background-color: #ffca28; color: white; }
        .diamond.next { background-color: #a496ff; color: white; }
        .progress-line { width: 120px; height: 3px; background-color: rgba(255,255,255,0.4); }

        #main-score {
            font-size: 65px; font-weight: 900; color: white; margin-top: 5px;
            text-shadow: 2px 3px 5px rgba(0,0,0,0.2); transition: transform 0.1s ease;
        }

        #start-text {
            position: absolute; bottom: 25%; width: 100%; text-align: center;
            font-size: 26px; font-weight: 900; color: white; text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: none;
        }
        .hand-icon { font-size: 45px; animation: bounceHand 1s infinite alternate; }
        @keyframes bounceHand { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        #energy-bar {
            position: absolute; bottom: 6%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.25); padding: 10px 30px; border-radius: 30px;
            color: #ffca28; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; z-index: 10;
            border: 2px solid rgba(255,255,255,0.2);
        }

        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); z-index: 20; display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
        }
        #game-over-screen h1 { color: #ffca28; font-size: 48px; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .restart-btn {
            background: #00e676; color: black; font-weight: bold; font-size: 20px; padding: 15px 40px; border-radius: 30px; border: none; cursor: pointer; box-shadow: 0 4px 15px rgba(0,230,118,0.5);
            display: flex; align-items: center; gap: 10px;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="score-pill">🏆 <span id="top-score-text">3607</span></div>
        <div class="icons-right">
            <div class="icon-circle">🔊</div>
            <div class="icon-circle">👤</div>
        </div>
    </div>

    <div id="level-ui">
        <div class="level-progress">
            <div class="diamond current"><span>3</span></div>
            <div class="progress-line"></div>
            <div class="diamond next"><span>4</span></div>
        </div>
        <div id="main-score">3607</div>
    </div>

    <div id="start-text">
        TAP TO START
        <div class="hand-icon">👆🏻</div>
    </div>

    <div id="energy-bar">
        ⚡ ENERGY
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <button class="restart-btn" onclick="location.reload()">🔄 RESTART</button>
    </div>

    <div id="game-canvas"></div>

<script>
    // --- مؤثرات صوتية تفاعلية ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'break') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(120, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'gameover') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.4);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    // --- إعداد الثلاثي الأبعاد (Three.js) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('game-canvas').appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
    dirLight.position.set(10, 25, 10);
    scene.add(dirLight);

    const towerGroup = new THREE.Group();
    scene.add(towerGroup);

    // العمود الأبيض الأوسط (الذي تخرج منه الكرة)
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.4 });
    const centralPillar = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.3, 90, 32), pillarMat);
    towerGroup.add(centralPillar);

    // تفاصيل البرج
    for(let i=0; i<30; i++) {
        let ring = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.35, 32), pillarMat);
        ring.position.y = 15 - i * 3.2;
        towerGroup.add(ring);
    }

    // بناء الحلقات الحلزونية المتصلة (أصفر وأسود)
    const platforms = [];
    const radius = 3.8;
    const thickness = 0.45;

    for (let i = 0; i < 22; i++) {
        let yPos = 12 - i * 3.2;
        let pGroup = new THREE.Group();
        pGroup.position.y = yPos;
        pGroup.rotation.y = Math.random() * Math.PI * 2;

        let safeAngleSize = Math.PI * 1.2; // الجزء الأصفر الآمن

        // الجزء الأصفر
        let safeGeo = new THREE.CylinderGeometry(radius, radius, thickness, 32, 1, false, 0, safeAngleSize);
        let safeMat = new THREE.MeshStandardMaterial({ color: 0xffca28, roughness: 0.3 });
        let safeMesh = new THREE.Mesh(safeGeo, safeMat);
        pGroup.add(safeMesh);

        // الجزء الأسود
        let dangerGeo = new THREE.CylinderGeometry(radius, radius, thickness, 32, 1, false, safeAngleSize, (Math.PI * 2) - safeAngleSize);
        let dangerMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.3 });
        let dangerMesh = new THREE.Mesh(dangerGeo, dangerMat);
        pGroup.add(dangerMesh);

        platforms.push({
            group: pGroup,
            y: yPos,
            broken: false,
            safeMesh: safeMesh,
            safeStart: 0,
            safeEnd: safeAngleSize
        });
        towerGroup.add(pGroup);
    }

    // الكرة الزرقاء التي تسقط من العمود
    const ball = new THREE.Mesh(
        new THREE.SphereGeometry(0.48, 32, 32),
        new THREE.MeshStandardMaterial({ color: 0x2196f3, roughness: 0.2, metalness: 0.3 })
    );
    ball.position.set(0, 14, 0); // تبدأ من داخل العمود
    scene.add(ball);

    camera.position.set(0, ball.position.y + 4.5, 12.5);
    camera.lookAt(0, ball.position.y - 1, 0);

    // متغيرات التحكم
    let gameState = 'START';
    let score = 3607;
    let velocityY = 0;
    const gravity = -0.016;
    
    let targetRotation = 0;
    let isDragging = false;
    let previousX = 0;
    let shatterParticles = [];

    function startDrag(x) {
        initAudio();
        if (gameState === 'START') {
            gameState = 'PLAYING';
            document.getElementById('start-text').style.display = 'none';
        }
        if (gameState !== 'PLAYING') return;
        isDragging = true; previousX = x;
    }
    function onDrag(x) {
        if (!isDragging) return;
        targetRotation += (x - previousX) * 0.012;
        previousX = x;
    }
    function stopDrag() { isDragging = false; }

    window.addEventListener('touchstart', e => startDrag(e.touches[0].clientX));
    window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX));
    window.addEventListener('touchend', stopDrag);
    window.addEventListener('mousedown', e => startDrag(e.clientX));
    window.addEventListener('mousemove', e => onDrag(e.clientX));
    window.addEventListener('mouseup', stopDrag);

    function addScore() {
        score += 15;
        document.getElementById('top-score-text').innerText = score;
        const bigScore = document.getElementById('main-score');
        bigScore.innerText = score;
        bigScore.style.transform = 'scale(1.25)';
        setTimeout(() => bigScore.style.transform = 'scale(1)', 150);
    }

    // تأثير تطاير القطع الصفراء عند الكسر
    function createShatter(yPos, currentRotation) {
        for(let i=0; i<10; i++) {
            let p = new THREE.Mesh(
                new THREE.BoxGeometry(0.35, 0.35, 0.35),
                new THREE.MeshStandardMaterial({ color: 0xffca28 })
            );
            let angle = currentRotation + (Math.random() * 2 - 1);
            p.position.set(Math.sin(angle) * 3, yPos, Math.cos(angle) * 3);
            p.velocity = new THREE.Vector3((Math.random() - 0.5) * 0.25, Math.random() * 0.35 + 0.05, (Math.random() - 0.5) * 0.25);
            scene.add(p);
            shatterParticles.push(p);
        }
    }

    // حلقة اللعبة المستمرة
    function animate() {
        requestAnimationFrame(animate);

        towerGroup.rotation.y += (targetRotation - towerGroup.rotation.y) * 0.15;

        // تحديث قطع التكسير المتطايرة
        for(let i = shatterParticles.length - 1; i >= 0; i--) {
            let p = shatterParticles[i];
            p.velocity.y += gravity * 1.2;
            p.position.add(p.velocity);
            p.rotation.x += 0.1; p.rotation.y += 0.1;
            if(p.position.y < ball.position.y - 12) {
                scene.remove(p);
                shatterParticles.splice(i, 1);
            }
        }

        if (gameState === 'PLAYING') {
            velocityY += gravity;
            ball.position.y += velocityY;

            // تتبع الكاميرا للكرة بنعومة تامة
            let targetCamY = ball.position.y + 4.5;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.lookAt(0, ball.position.y - 1.5, 0);

            // فحص الاصطدام مع الحلقات
            let activePlat = platforms.find(p => !p.broken && ball.position.y <= p.y + 0.3 && ball.position.y >= p.y - 0.4);

            if (activePlat && velocityY < 0) {
                // حساب موقع الكرة بدقة على الحلقة بناءً على الدوران
                let ballAngle = 0; // زاوية وجه الكاميرا الأمامي
                let relativeAngle = (ballAngle - towerGroup.rotation.y - activePlat.group.rotation.y) % (Math.PI * 2);
                if (relativeAngle < 0) relativeAngle += Math.PI * 2;

                // هل سقطت على الجزء الأصفر الآمن أم الأسود الخطير؟
                if (relativeAngle >= activePlat.safeStart && relativeAngle <= activePlat.safeEnd) {
                    // نجاح! كسر الجزء الأصفر والانتقال للمستوى أدناه
                    activePlat.broken = true;
                    activePlat.group.remove(activePlat.safeMesh);
                    
                    playSound('break');
                    addScore();
                    createShatter(activePlat.y, relativeAngle + towerGroup.rotation.y + activePlat.group.rotation.y);
                    
                    // دفع الكرة للأسفل بقوة واستمرار السقوط
                    velocityY = -0.35;
                } else {
                    // اصطدام بالأسود: خسارة فورية
                    playSound('gameover');
                    gameState = 'GAMEOVER';
                    document.getElementById('game-over-screen').style.display = 'flex';
                }
            }

            // فوز أو الوصول للنهاية
            if (ball.position.y < platforms[platforms.length - 1].y - 3) {
                location.reload();
            }
        }

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
