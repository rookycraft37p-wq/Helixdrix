<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #120c24; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 450px;
            background: linear-gradient(to bottom, #2c1654, #120c24);
            display: flex; flex-direction: column; align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 12, 36, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 20; text-align: center;
            padding: 20px;
        }
        .screen h1 { font-size: 40px; color: #ffeb3b; text-shadow: 2px 2px #ff5722; margin-bottom: 10px; }
        .btn {
            padding: 15px 45px; font-size: 22px; font-weight: bold; background-color: #00e676;
            color: #000; border: 3px solid #fff; border-radius: 35px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,230,118,0.5);
        }

        #hud {
            position: absolute; top: 20px; left: 20px; right: 20px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 18px; font-weight: bold; z-index: 10; display: none;
            background: rgba(0, 0, 0, 0.4); padding: 10px 18px; border-radius: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <h1>HELIXDRIX</h1>
        <p style="margin-bottom: 25px; color: #ddd; font-size: 16px;">حطم طبقات البرج الحلزوني مثل الفيديو تماماً!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5252;">انتهت اللعبة</h1>
        <p id="final-score" style="font-size: 22px; margin-bottom: 25px;">النتيجة: 0</p>
        <button class="btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="hud">
        <div>النتيجة: <span id="score">3607</span></div>
        <div style="color: #ffeb3b;">⚡ ENERGY</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'bounce') {
            osc.frequency.setValueAtTime(350, now);
            osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, now);
            osc.frequency.linearRampToValueAtTime(60, now + 0.18);
            gain.gain.setValueAtTime(0.25, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
            osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'gameover') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.linearRampToValueAtTime(90, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    canvas.height = GH;

    let score = 3607;
    let towerAngle = 0;
    let targetAngle = 0;

    let player = {
        x: GW / 2,
        y: 180,
        vy: 0,
        size: 24,
        gravity: 0.5,
        jumpPower: -9
    };

    let slices = [];

    function initLevel() {
        score = 3607;
        scoreEl.innerText = score;
        player.y = 150; player.vy = 0;
        
        slices = [];
        let totalSlices = 18;
        let sliceAngleSize = Math.PI / 4; // كل حلقة مقسمة إلى أجزاء
        
        for (let i = 0; i < totalSlices; i++) {
            let parts = [];
            let gapIndex = Math.floor(Math.random() * 8); // مكان الفجوة
            for (let p = 0; p < 8; p++) {
                if (p === gapIndex || p === (gapIndex + 1) % 8) {
                    parts.push({ active: false }); // فجوة للعبور
                } else {
                    parts.push({
                        active: true,
                        color: i === totalSlices - 1 ? '#00e676' : (i % 2 === 0 ? '#ffc107' : '#333333') // ألوان مطابقة للفيديو (أصفر وأسود)
                    });
                }
            }
            slices.push({
                y: 240 + i * 26,
                parts: parts
            });
        }
    }
