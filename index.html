<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع DrixMods | تحميل المودات</title>
    
    <!-- كود إعلانات Adsterra -->
    <script src="https://pl31521547.profitableratecpmnetwork.com/e0/5e/26/e05e267367d2d60bedabf61e1097c8f2.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #4CAF50;
        }

        header h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .mod-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s ease;
        }

        .mod-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
        }

        .mod-title {
            font-size: 2rem;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .mod-description {
            color: #cccccc;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .countdown-text {
            font-size: 1.1rem;
            color: #ffa500;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .download-btn {
            display: none; /* مخفي لحين انتهاء العد التنازلي */
            background-color: #4CAF50;
            color: #ffffff;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            margin: 0 auto;
        }

        .download-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        .download-btn:active {
            transform: scale(0.95);
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>DrixMods</h1>
        <p>المكان الأفضل لتحميل أحدث مودات ماين كرافت</p>
    </header>

    <div class="container">
        <div class="mod-card">
            <h2 class="mod-title">مود القرويين المتكلمين</h2>
            <p class="mod-description">
                يضيف هذا المود أصواتاً وتفاعلات واقعية للقرويين في اللعبة لجعل تجربتك في ماين كرافت أكثر حيوية ومتعة.
            </p>
            
            <div id="countdown-timer" class="countdown-text">⏳ يرجى الانتظار <span id="timer">10</span> ثوانٍ لظهور رابط التحميل...</div>
            
            <a id="download-btn" href="https://files.catbox.moe/d246za.zip" download="talking-villagers.mcaddon" class="download-btn">
                📥 تحميل المود الآن
            </a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - DrixMods</p>
    </footer>

    <script>
        // كود العد التنازلي من 10 إلى 0
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        const countdownContainer = document.getElementById('countdown-timer');
        const downloadBtn = document.getElementById('download-btn');

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                countdownContainer.style.display = 'none'; // إخفاء جملة الانتظار
                downloadBtn.style.display = 'inline-block'; // إظهار زر التحميل الأخضر
            }
        }, 1000);
    </script>

</body>
</html>
