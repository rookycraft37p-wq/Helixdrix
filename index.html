<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="حمّل مود القرويين المتكلمين لماينكرافت.">
    <title>تحميل مود القرويين المتكلمين | الاحترافي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 24px 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff7f00, #ff0000, #ffff00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #ccc;
            margin-bottom: 30px;
            line-height: 1.8;
        }
        .download-btn {
            display: inline-block;
            background: linear-gradient(45deg, #00ff87, #60efff);
            color: #0f0c29;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(0, 255, 135, 0.4);
            transition: all 0.3s ease;
        }
        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 135, 0.6);
        }
        .download-btn:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }
        .footer {
            margin-top: 30px;
            font-size: 0.9rem;
            color: #aaa;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 2rem; }
            p { font-size: 1rem; }
            .download-btn { padding: 13px 28px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>مود القرويين المتكلمين</h1>
        <p>استمتع بتجربة إضافية خرافية داخل لعبة ماينكرافت! احصل على المود الآن واستكشف تفاصيل جديدة كلياً في عالمك.</p>
        <a href="talking-villagers.mcaddon" download="talking-villagers.mcaddon" class="download-btn">تحميل المود الآن</a>
        <div class="footer">تم تطوير الموقع وتصميمه باحترافية عالية من أجلك.</div>
    </main>
</body>
</html>
