<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #120c24; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 450px;
            background: linear-gradient(to bottom, #251647, #120c24);
            display: flex; flex-direction: column; align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(18, 12, 36, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 20; text-align: center;
            padding: 20px;
        }
        .screen h1 { font-size: 38px; color: #ffeb3b; text-shadow: 2px 2px #ff5722; margin-bottom: 10px; }
        .btn {
            padding: 14px 45px; font-size: 22px; font-weight: bold; background-color: #00e676;
            color: #000; border: 3px solid #fff; border-radius: 35px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,230,118,0.5);
        }

        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 16px; font-weight: bold; z-index: 10; display: none;
            background: rgba(0, 0, 0, 0.4); padding: 8px 15px; border-radius: 12px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <h1>HELIXDRIX</h1>
        <p style="margin-bottom: 25px; color: #ddd; font-size: 16px;">المكعب الأحمر والحلقات الحلزونية الناعمة!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5252;">انتهت اللعبة</h1>
        <p id="final-score" style="font-size: 22px; margin-bottom: 25px;">النتيجة: 0</p>
        <button class="btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="hud">
        <div>النتيجة: <span id="score">0</span></div>
        <div style="color: #ffeb3b;">⚡ طاقة</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'bounce') {
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(650, now + 0.1);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'gameover') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const GW = 400, GH = 750;
    canvas.width = GW;
    canvas.height = GH;

    let gameState = 'START';
    let score = 0;
    let rotationAngle = 0;
    let targetRotation = 0;

    let player = {
        x: GW / 2,
        y: 160,
        vy: 0,
        size: 24,
        gravity: 0.45,
        jumpPower: -8.5
    };

    let disks = [];

    function initLevel() {
        score = 0;
        scoreEl.innerText = score;
        player.y = 140; player.vy = 0;
        
        disks = [];
        let numDisks = 14;
        for (let i = 0; i < numDisks; i++) {
            let gapStart = Math.random() * Math.PI * 1.5;
            disks.push({
                y: 200 + i * 42,
                radius: 110,
                gapStart: gapStart,
                gapSize: 1.4,
                color: i === numDisks - 1 ? '#00e676' : (i % 2 === 0 ? '#ff3366' : '#9c27b0'), // ألوان وردية وبنفسجية مطابقة للصور
                broken: false
            });
        }
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        initLevel();
        gameState = 'PLAYING';
    }

    function gameOver() {
        playSound('gameover');
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score}`;
        document.getElementById('gameover-screen').style.display = 'flex';
    }

    let isDragging = false, startX = 0;
    window.addEventListener('pointerdown', e => { isDragging = true; startX = e.clientX; });
    window.addEventListener('pointermove', e => {
        if (!isDragging || gameState !== 'PLAYING') return;
        targetRotation += (e.clientX - startX) * 0.012;
        startX = e.clientX;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    function update() {
        if (gameState === 'PLAYING') {
            rotationAngle += (targetRotation - rotationAngle) * 0.1;
            player.vy += player.gravity;
            player.y += player.vy;

            let centerX = GW / 2;
            let currentDiskIndex = Math.floor((player.y - 180) / 42);

            if (currentDiskIndex >= 0 && currentDiskIndex < disks.length) {
                let disk = disks[currentDiskIndex];
                if (!disk.broken) {
                    let playerAngle = Math.atan2(player.y - disk.y, player.x - centerX) - rotationAngle;
                    while (playerAngle < 0) playerAngle += Math.PI * 2;
                    while (playerAngle > Math.PI * 2) playerAngle -= Math.PI * 2;

                    let inGap = playerAngle >= disk.gapStart && playerAngle <= (disk.gapStart + disk.gapSize);

                    if (inGap && player.vy > 0) {
                        player.vy = player.jumpPower * 0.85;
                        score += 10;
                        scoreEl.innerText = score;
                        playSound('bounce');
                    } else if (!inGap && player.y + player.size / 2 >= disk.y && player.y - player.size / 2 <= disk.y + 10) {
                        if (player.vy > 0) {
                            player.y = disk.y - player.size / 2;
                            player.vy = player.jumpPower;
                            playSound('bounce');
                        }
                    }
                }
            }

            if (player.y > disks[disks.length - 1].y + 40) {
                score += 100;
                initLevel();
            }

            if (player.y > GH + 50) gameOver();
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, GW, GH);
        let centerX = GW / 2;

        // رسم الحلقات الدائرية الحلزونية الناعمة المنحنية تماماً مثل الصور
        disks.forEach((disk) => {
            if (disk.broken) return;
            ctx.save();
            ctx.translate(centerX, disk.y);
            ctx.rotate(rotationAngle);

            ctx.beginPath();
            ctx.arc(0, 0, disk.radius, disk.gapStart + disk.gapSize, disk.gapStart + Math.PI * 2);
            ctx.lineWidth = 14;
            ctx.lineCap = 'round';
            ctx.strokeStyle = disk.color;
            ctx.stroke();

            ctx.restore();
        });

        // رسم المكعب الأحمر العصبي ذي العيون في المنتصف تماماً
        ctx.save();
        ctx.translate(centerX, player.y);
        ctx.fillStyle = '#ff3333';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 15;
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        
        // العيون
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-7, -5, 5, 5);
        ctx.fillRect(2, -5, 5, 5);
        ctx.fillStyle = '#000000';
        ctx.fillRect(-5, -3, 2, 2);
        ctx.fillRect(4, -3, 2, 2);
        ctx.restore();
    }

    update();
</script>
</body>
</html>
