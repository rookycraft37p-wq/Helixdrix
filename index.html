<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع DrixMods | تحميل المودات</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #1f1f1f;
            padding: 20px;
            text-align: center;
            border-bottom: 3px solid #4CAF50;
        }

        header h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            color: #aaaaaa;
            font-size: 1.1rem;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .mod-card {
            background-color: #1e1e1e;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid #333;
            transition: transform 0.3s ease;
        }

        .mod-card:hover {
            transform: translateY(-5px);
            border-color: #4CAF50;
        }

        .mod-title {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .mod-description {
            color: #cccccc;
            margin-bottom: 20px;
            font-size: 1rem;
        }

        .download-btn {
            display: inline-block;
            background-color: #4CAF50;
            color: #ffffff;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
        }

        .download-btn:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>DrixMods</h1>
        <p>المكان الأفضل لتحميل أحدث مودات ماين كرافت</p>
    </header>

    <div class="container">
        <!-- المود الأول -->
        <div class="mod-card">
            <h2 class="mod-title">مود ماين كرافت (الأول)</h2>
            <p class="mod-description">اضغط بالأسفل لتحميل المود الأول برابط مباشر وسريع.</p>
            <a href="https://drive.google.com/uc?export=download&id=1m6Da136ikZauDopvClfl_FmdRLEaKZMh" class="download-btn">
                📥 تحميل المود الأول
            </a>
        </div>

        <!-- المود الثاني -->
        <div class="mod-card">
            <h2 class="mod-title">مود ماين كرافت (الثاني)</h2>
            <p class="mod-description">اضغط بالأسفل لتحميل المود الثاني برابط مباشر وسريع.</p>
            <a href="https://drive.google.com/uc?export=download&id=1d36LXXDgACPtRT3p54MJrW4wFD51IOl4" class="download-btn">
                📥 تحميل المود الثاني
            </a>
        </div>
    </div>

    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026 - DrixMods</p>
    </footer>

</body>
</html>
