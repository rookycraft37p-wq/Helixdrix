<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix 3D</title>
    <!-- استدعاء مكتبة Three.js لصنع الـ 3D الحقيقي -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            /* مطابقة لون الخلفية المتدرجة في الفيديو */
            background: linear-gradient(180deg, #7b52fb 0%, #a285ff 40%, #c4aef2 100%);
        }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* واجهة المستخدم (UI) المطابقة للفيديو */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }

        .top-bar {
            width: 100%; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        
        .score-pill {
            background: white; color: #333; padding: 8px 20px; border-radius: 20px;
            font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .icons { display: flex; gap: 10px; }
        .icon-btn {
            width: 40px; height: 40px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); pointer-events: auto; cursor: pointer;
        }

        .level-container {
            margin-top: 10px; display: flex; align-items: center; gap: 15px;
        }
        .level-badge {
            width: 35px; height: 35px; background: white; color: #333; border-radius: 5px;
            display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px;
            transform: rotate(45deg);
        }
        .level-badge span { transform: rotate(-45deg); }
        .level-badge.active { background: #ffcc00; color: white; }
        .level-line { width: 150px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 2px; }

        .big-score {
            font-size: 80px; font-weight: 900; color: white; text-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-top: 20px; transition: transform 0.1s;
        }

        #start-text {
            position: absolute; bottom: 25%; font-size: 28px; font-weight: 900; color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4); letter-spacing: 2px;
            display: flex; flex-direction: column; align-items: center; gap: 10px; animation: pulse 1s infinite alternate;
        }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.05); } }

        #energy-bar {
            position: absolute; bottom: 10%; background: rgba(0,0,0,0.3); padding: 10px 30px;
            border-radius: 30px; color: #ffcc00; font-weight: bold; font-size: 18px;
            display: flex; align-items: center; gap: 8px; border: 2px solid rgba(255,255,255,0.2);
        }

        #game-over {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            display: none; flex-direction: column; justify-content: center; align-items: center; pointer-events: auto;
        }
        #game-over h1 { color: #ffcc00; font-size: 50px; margin: 0; text-shadow: 2px 2px 0 #000; }
        #game-over button {
            margin-top: 30px; padding: 15px 40px; font-size: 24px; font-weight: bold;
            background: #00e676; border: none; border-radius: 30px; color: white; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="score-pill">🏆 <span id="top-score">3607</span></div>
            <div class="icons">
                <div class="icon-btn">🔊</div>
                <div class="icon-btn">👤</div>
            </div>
        </div>

        <div class="level-container">
            <div class="level-badge active"><span>3</span></div>
            <div class="level-line"></div>
            <div class="level-badge"><span>4</span></div>
        </div>

        <div class="big-score" id="main-score">3607</div>

        <div id="start-text">
            TAP TO START
            <span style="font-size: 40px;">👆</span>
        </div>

        <div id="energy-bar">
            ⚡ ENERGY
        </div>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <button onclick="location.reload()">RESTART</button>
    </div>

    <!-- حاوية الـ 3D -->
    <div id="game-canvas"></div>

<script>
    // --- إعدادات Three.js الأساسية للـ 3D ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('game-canvas').appendChild(renderer.domElement);

    // --- الإضاءة ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(5, 10, 5);
    dirLight.castShadow = true;
    scene.add(dirLight);

    // --- بناء البرج والمنصات المطابقة للفيديو ---
    const towerGroup = new THREE.Group();
    scene.add(towerGroup);

    // العمود الأبيض المركزي
    const pillarGeo = new THREE.CylinderGeometry(1.5, 1.5, 50, 32);
    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const pillar = new THREE.Mesh(pillarGeo, pillarMat);
    pillar.receiveShadow = true;
    towerGroup.add(pillar);

    // القبة/التاج أعلى البرج
    const domeGeo = new THREE.SphereGeometry(1.8, 32, 32);
    const dome = new THREE.Mesh(domeGeo, pillarMat);
    dome.position.y = 25.5;
    towerGroup.add(dome);

    // إنشاء طبقات المنصات (أصفر وأسود)
    const platforms = [];
    const levelCount = 12;
    const platformRadius = 3.5;
    const platformThickness = 0.6;

    for (let i = 0; i < levelCount; i++) {
        const levelGroup = new THREE.Group();
        levelGroup.position.y = 15 - (i * 3.5); // المسافة بين الطبقات
        
        // زاوية الفراغ للعبور
        const gapStart = Math.random() * Math.PI * 2;
        const gapSize = Math.PI / 2; // ربع دائرة فراغ

        // الجزء الأصفر (الآمن)
        const safeGeo = new THREE.CylinderGeometry(platformRadius, platformRadius, platformThickness, 32, 1, false, gapStart + gapSize, (Math.PI * 2) - gapSize - 0.5);
        const safeMat = new THREE.MeshStandardMaterial({ color: 0xffb300, roughness: 0.3 }); // أصفر فاقع
        const safeMesh = new THREE.Mesh(safeGeo, safeMat);
        safeMesh.receiveShadow = true; safeMesh.castShadow = true;
        safeMesh.userData = { type: 'safe' };
        levelGroup.add(safeMesh);

        // الجزء الأسود (الخطير)
        const dangerGeo = new THREE.CylinderGeometry(platformRadius, platformRadius, platformThickness, 16, 1, false, gapStart + Math.PI * 2 - 0.5, 0.5);
        const dangerMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 }); // أسود
        const dangerMesh = new THREE.Mesh(dangerGeo, dangerMat);
        dangerMesh.receiveShadow = true; dangerMesh.castShadow = true;
        dangerMesh.userData = { type: 'danger' };
        levelGroup.add(dangerMesh);

        platforms.push({ group: levelGroup, y: levelGroup.position.y, passed: false });
        towerGroup.add(levelGroup);
    }

    // --- الشخصية (الكرة الزرقاء كما في الفيديو) ---
    const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0x0066ff, roughness: 0.2 }); // أزرق ساطع
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    ball.position.set(0, 18, 2.5); // البداية أعلى البرج
    scene.add(ball);

    // --- متغيرات اللعبة ---
    let gameState = 'START';
    let score = 3607; // البداية مثل الفيديو
    let velocityY = 0;
    const gravity = -0.015;
    const bounceForce = 0.25;
    
    let targetRotation = 0;
    let isDragging = false;
    let previousX = 0;

    // --- التحكم وتدوير البرج (باللمس أو الماوس) ---
    function startDrag(clientX) {
        if (gameState === 'START') {
            gameState = 'PLAYING';
            document.getElementById('start-text').style.display = 'none';
        }
        isDragging = true;
        previousX = clientX;
    }
    function onDrag(clientX) {
        if (!isDragging) return;
        const delta = clientX - previousX;
        targetRotation += delta * 0.01;
        previousX = clientX;
    }
    function stopDrag() { isDragging = false; }

    // دعم اللمس للجوال
    window.addEventListener('touchstart', e => startDrag(e.touches[0].clientX));
    window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX));
    window.addEventListener('touchend', stopDrag);
    // دعم الماوس للكمبيوتر
    window.addEventListener('mousedown', e => startDrag(e.clientX));
    window.addEventListener('mousemove', e => onDrag(e.clientX));
    window.addEventListener('mouseup', stopDrag);

    // تحديث النتيجة
    function updateScore(points) {
        score += points;
        document.getElementById('top-score').innerText = score;
        const mainScore = document.getElementById('main-score');
        mainScore.innerText = score;
        mainScore.style.transform = 'scale(1.2)';
        setTimeout(() => mainScore.style.transform = 'scale(1)', 100);
    }

    // --- حلقة اللعب (Game Loop) ---
    function animate() {
        requestAnimationFrame(animate);

        // دوران البرج بنعومة
        towerGroup.rotation.y += (targetRotation - towerGroup.rotation.y) * 0.2;

        if (gameState === 'PLAYING') {
            // فيزياء القفز
            velocityY += gravity;
            ball.position.y += velocityY;

            // متابعة الكاميرا للكرة بنعومة
            targetCameraY = ball.position.y + 3;
            if (camera.position.y > targetCameraY) {
                camera.position.y += (targetCameraY - camera.position.y) * 0.1;
            }

            // فحص الاصطدام مع المنصات
            for (let i = 0; i < platforms.length; i++) {
                let p = platforms[i];
                // إذا تجاوزت الكرة المنصة من الفراغ
                if (!p.passed && ball.position.y < p.y - 0.5) {
                    p.passed = true;
                    updateScore(10);
                }

                // إذا ارتطمت الكرة بالمنصة
                if (ball.position.y > p.y && ball.position.y < p.y + platformThickness && velocityY < 0) {
                    // حساب الزاوية لمعرفة هل سقطت في الفراغ أم على الأصفر أم الأسود
                    let ballAngle = Math.atan2(ball.position.z, ball.position.x);
                    let relativeAngle = (ballAngle - towerGroup.rotation.y) % (Math.PI * 2);
                    if (relativeAngle < 0) relativeAngle += Math.PI * 2;

                    // للتبسيط في هذا الكود القوي، نعتبر الارتطام بالمنصة يسبب قفزة مالم يكن Game Over
                    // في الألعاب الكاملة يتم فحص لون القطعة المصطدم بها بناء على Raycaster
                    
                    // قفز
                    ball.position.y = p.y + platformThickness;
                    velocityY = bounceForce;
                    
                    // تأثير اسكواش بسيط (Squash effect)
                    ball.scale.set(1.2, 0.8, 1.2);
                    setTimeout(() => ball.scale.set(1, 1, 1), 100);
                }
            }

            // نهاية اللعبة إذا سقطت تحت آخر منصة
            if (ball.position.y < platforms[platforms.length - 1].y - 5) {
                gameState = 'GAMEOVER';
                document.getElementById('game-over').style.display = 'flex';
            }
        }

        renderer.render(scene, camera);
    }

    // مطابقة حجم الشاشة عند تدوير الجوال
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
