<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix 3D Exact</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Arial', sans-serif; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: linear-gradient(to bottom, #998cff, #7155ff); }
        
        #game-canvas { display: block; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

        /* البار العلوي المطابق للفيديو */
        #top-bar {
            position: absolute; top: 0; left: 0; width: 100%; height: 60px; background-color: #8375f2;
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px; z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .score-pill {
            background: white; color: #333; padding: 6px 18px; border-radius: 20px;
            font-weight: bold; font-size: 16px; display: flex; align-items: center; gap: 8px;
        }
        .icons-right { display: flex; gap: 10px; }
        .icon-circle {
            width: 35px; height: 35px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 18px; color: #8375f2;
        }

        /* واجهة المستويات والنتيجة */
        #level-ui {
            position: absolute; top: 80px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none;
        }
        .level-progress { display: flex; align-items: center; gap: 10px; }
        .diamond {
            width: 25px; height: 25px; display: flex; justify-content: center; align-items: center;
            font-weight: bold; font-size: 14px; transform: rotate(45deg);
        }
        .diamond span { transform: rotate(-45deg); }
        .diamond.current { background-color: #ffca28; color: white; }
        .diamond.next { background-color: #a496ff; color: white; }
        .progress-line { width: 120px; height: 3px; background-color: rgba(255,255,255,0.4); position: relative; }

        #main-score {
            font-size: 65px; font-weight: 900; color: white; margin-top: 10px;
            text-shadow: 2px 3px 5px rgba(0,0,0,0.2); transition: transform 0.1s ease;
        }

        /* نصوص البداية والطاقة */
        #start-text {
            position: absolute; bottom: 30%; width: 100%; text-align: center;
            font-size: 26px; font-weight: 900; color: white; text-shadow: 1px 2px 4px rgba(0,0,0,0.3);
            z-index: 10; display: flex; flex-direction: column; align-items: center; gap: 15px; pointer-events: none;
        }
        .hand-icon { font-size: 45px; animation: bounceHand 1s infinite alternate; }
        @keyframes bounceHand { from { transform: translateY(0); } to { transform: translateY(-10px); } }

        #energy-bar {
            position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.2); padding: 10px 25px; border-radius: 30px;
            color: white; font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 8px; z-index: 10;
        }
        .energy-icon { background: white; color: #333; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 14px; }

        /* شاشة الخسارة */
        #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 20; display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        #game-over-screen h1 { color: #ffca28; font-size: 45px; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .restart-btn {
            background: #00e676; color: black; font-weight: bold; font-size: 20px; padding: 15px 40px; border-radius: 30px; border: none; cursor: pointer;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <div class="score-pill">🏆 <span id="top-score-text">3607</span></div>
        <div class="icons-right">
            <div class="icon-circle">🔊</div>
            <div class="icon-circle">👤</div>
        </div>
    </div>

    <div id="level-ui">
        <div class="level-progress">
            <div class="diamond current"><span>3</span></div>
            <div class="progress-line"></div>
            <div class="diamond next"><span>4</span></div>
        </div>
        <div id="main-score">3607</div>
    </div>

    <div id="start-text">
        TAP TO START
        <div class="hand-icon">👆🏻</div>
    </div>

    <div id="energy-bar">
        <div class="energy-icon">⚡</div> ENERGY
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <button class="restart-btn" onclick="location.reload()">🔄 RESTART</button>
    </div>

    <div id="game-canvas"></div>

<script>
    // إعداد المشهد والكاميرا
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('game-canvas').appendChild(renderer.domElement);

    // الإضاءة لتوضيح الألوان
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    // بناء البرج (العمود الأبيض بتفاصيل المئذنة)
    const towerGroup = new THREE.Group();
    scene.add(towerGroup);

    const pillarMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
    const centralPillar = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 80, 32), pillarMat);
    towerGroup.add(centralPillar);

    // إضافة تفاصيل معمارية للبرج (حلقات بارزة)
    for(let i=0; i<25; i++) {
        let ring = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, 0.4, 32), pillarMat);
        ring.position.y = 10 - i * 3.5;
        towerGroup.add(ring);
    }
    // قبة البرج العلوية
    let dome = new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 32), pillarMat);
    dome.position.y = 12.5;
    towerGroup.add(dome);

    // بناء المنصات (الأصفر الآمن والأسود الخطير)
    const platforms = [];
    const radius = 3.8;
    const thickness = 0.5;
    const gapSize = Math.PI / 2.2; // حجم الفتحة لمرور الكرة
    const safeSize = Math.PI * 1.3; // حجم المنطقة الصفراء
    
    for (let i = 0; i < 15; i++) {
        let yPos = 8 - i * 3.5;
        let pGroup = new THREE.Group();
        pGroup.position.y = yPos;
        
        // تدوير عشوائي لكل منصة
        pGroup.rotation.y = Math.random() * Math.PI * 2;

        // الجزء الأصفر (الآمن)
        let safeGeo = new THREE.CylinderGeometry(radius, radius, thickness, 32, 1, false, gapSize, safeSize);
        let safeMat = new THREE.MeshStandardMaterial({ color: 0xffca28 }); // لون أصفر فاقع مطابق للفيديو
        let safeMesh = new THREE.Mesh(safeGeo, safeMat);
        pGroup.add(safeMesh);

        // الجزء الأسود (الخطير)
        let dangerGeo = new THREE.CylinderGeometry(radius, radius, thickness, 16, 1, false, gapSize + safeSize, (Math.PI * 2) - gapSize - safeSize);
        let dangerMat = new THREE.MeshStandardMaterial({ color: 0x222222 }); // لون أسود
        let dangerMesh = new THREE.Mesh(dangerGeo, dangerMat);
        pGroup.add(dangerMesh);

        platforms.push({ group: pGroup, y: yPos, passed: false });
        towerGroup.add(pGroup);
    }

    // الكرة الزرقاء (مضبوطة لتبدأ فوق أول منصة تماماً وتكون مرئية)
    const ballGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const ballMat = new THREE.MeshStandardMaterial({ color: 0x2196f3, roughness: 0.2 }); // أزرق ساطع
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.position.set(0, 10, 2.8);
    scene.add(ball);

    // **إصلاح مكان الكاميرا لتركز على الكرة**
    camera.position.set(0, ball.position.y + 5, 13);
    camera.lookAt(0, ball.position.y - 1, 0);

    // متغيرات اللعبة
    let gameState = 'START';
    let score = 3607; // الرقم الذي طلبته
    let velocityY = 0;
    const gravity = -0.018;
    const bounceForce = 0.35;
    
    let targetRotation = 0;
    let isDragging = false;
    let previousX = 0;

    // التحكم بالسحب
    function startDrag(x) {
        if (gameState === 'START') {
            gameState = 'PLAYING';
            document.getElementById('start-text').style.display = 'none';
        }
        if (gameState !== 'PLAYING') return;
        isDragging = true; previousX = x;
    }
    function onDrag(x) {
        if (!isDragging) return;
        targetRotation += (x - previousX) * 0.01;
        previousX = x;
    }
    function stopDrag() { isDragging = false; }

    window.addEventListener('touchstart', e => startDrag(e.touches[0].clientX));
    window.addEventListener('touchmove', e => onDrag(e.touches[0].clientX));
    window.addEventListener('touchend', stopDrag);
    window.addEventListener('mousedown', e => startDrag(e.clientX));
    window.addEventListener('mousemove', e => onDrag(e.clientX));
    window.addEventListener('mouseup', stopDrag);

    // تحديث النتيجة
    function addScore() {
        score++;
        document.getElementById('top-score-text').innerText = score;
        const bigScore = document.getElementById('main-score');
        bigScore.innerText = score;
        bigScore.style.transform = 'scale(1.2)';
        setTimeout(() => bigScore.style.transform = 'scale(1)', 150);
    }

    // حلقة الحركة والفيزياء
    function animate() {
        requestAnimationFrame(animate);

        // دوران البرج
        towerGroup.rotation.y += (targetRotation - towerGroup.rotation.y) * 0.2;

        if (gameState === 'PLAYING') {
            velocityY += gravity;
            ball.position.y += velocityY;

            // الكاميرا تتبع الكرة بمرونة لكي لا تختفي أبداً
            let targetCamY = ball.position.y + 4;
            camera.position.y += (targetCamY - camera.position.y) * 0.1;
            camera.lookAt(0, ball.position.y - 2, 0);

            // فيزياء الاصطدام مع المنصات
            let activePlat = platforms.find(p => !p.passed && ball.position.y < p.y + 0.8);
            if (activePlat) {
                // إذا لمست الكرة سطح المنصة
                if (ball.position.y <= activePlat.y + thickness/2 + 0.4 && velocityY < 0) {
                    
                    // حساب زاوية الكرة بالنسبة لدوران البرج ودوران المنصة
                    let ballAngle = Math.PI / 2; // مكان الكرة الثابت على محور Z
                    let totalAngle = (ballAngle - towerGroup.rotation.y - activePlat.group.rotation.y) % (Math.PI * 2);
                    if (totalAngle < 0) totalAngle += Math.PI * 2;

                    // فحص مكان السقوط
                    if (totalAngle >= 0 && totalAngle <= gapSize) {
                        // مرت من الفتحة بنجاح
                        activePlat.passed = true;
                        addScore();
                    } else if (totalAngle > gapSize && totalAngle <= gapSize + safeSize) {
                        // اصطدمت باللون الأصفر (قفزة)
                        ball.position.y = activePlat.y + thickness/2 + 0.4;
                        velocityY = bounceForce;
                        // تأثير تمدد الكرة عند القفز
                        ball.scale.set(1.3, 0.7, 1.3);
                        setTimeout(() => ball.scale.set(1, 1, 1), 150);
                    } else {
                        // اصطدمت باللون الأسود (خسارة)
                        gameState = 'GAMEOVER';
                        document.getElementById('game-over-screen').style.display = 'flex';
                    }
                }
            }

            // إذا وصلت لأسفل البرج (فوز)
            if (ball.position.y < platforms[platforms.length - 1].y - 3) {
                location.reload(); // إعادة اللعبة للمرحلة القادمة
            }
        }

        renderer.render(scene, camera);
    }
    
    // ضبط الأبعاد عند تدوير الجوال
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
