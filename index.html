<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #1a1a2e; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 850px;
            display: flex; flex-direction: column; align-items: center;
            background: linear-gradient(to bottom, #1b1b3a, #0f0c1b);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 12, 27, 0.9); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 20; text-align: center;
        }
        .screen h1 { font-size: 36px; color: #ffeb3b; text-shadow: 2px 2px #ff5722; margin-bottom: 10px; }
        .btn {
            padding: 14px 40px; font-size: 20px; font-weight: bold; background-color: #00e676;
            color: #000; border: 3px solid #fff; border-radius: 30px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,230,118,0.4);
        }

        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 18px; font-weight: bold; z-index: 10; display: none;
            background: rgba(0, 0, 0, 0.4); padding: 8px 15px; border-radius: 12px;
        }
        .energy-bar-container {
            width: 100px; height: 12px; background: rgba(255,255,255,0.2);
            border: 2px solid #fff; border-radius: 8px; overflow: hidden; display: inline-block; vertical-align: middle;
        }
        #energy-fill { width: 0%; height: 100%; background: #ffeb3b; transition: width 0.1s; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <h1>HELIXDRIX</h1>
        <p style="margin-bottom: 25px; font-size: 16px; color: #ccc;">وجه المكعب الأحمر وحطم الحلقات للأسفل!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5252;">انتهت اللعبة!</h1>
        <p id="final-score" style="font-size: 20px; margin-bottom: 20px;">النتيجة: 0</p>
        <button class="btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="hud">
        <div>النتيجة: <span id="score">0</span></div>
        <div>الطاقة: <div class="energy-bar-container"><div id="energy-fill"></div></div></div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        let now = audioCtx.currentTime;
        if (type === 'bounce') {
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'gameover') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const energyFill = document.getElementById('energy-fill');

    const GW = 400, GH = 700;
    canvas.width = GW;
    canvas.height = GH;

    let gameState = 'START';
    let score = 0;
    let energy = 0;
    let rotationAngle = 0;
    let targetRotation = 0;

    let player = {
        x: GW / 2,
        y: 120,
        vy: 0,
        size: 20,
        gravity: 0.45,
        jumpPower: -8.5
    };

    let disks = [];

    function initLevel() {
        score = 0; energy = 0;
        scoreEl.innerText = score;
        energyFill.style.width = '0%';
        player.y = 100; player.vy = 0;
        
        disks = [];
        let numDisks = 13;
        for (let i = 0; i < numDisks; i++) {
            let gapStart = Math.random() * Math.PI * 1.5;
            disks.push({
                y: 180 + i * 42,
                radius: 100,
                gapStart: gapStart,
                gapSize: 1.3,
                color: i === numDisks - 1 ? '#00e676' : (i % 2 === 0 ? '#ff4081' : '#7c4dff'),
                broken: false
            });
        }
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        initLevel();
        gameState = 'PLAYING';
    }

    function gameOver() {
        playSound('gameover');
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score}`;
        document.getElementById('gameover-screen').style.display = 'flex';
    }

    // تدوير البرج عبر السحب بالإصبع
    let isDragging = false;
    let startX = 0;

    window.addEventListener('pointerdown', e => {
        isDragging = true;
        startX = e.clientX;
    });
    window.addEventListener('pointermove', e => {
        if (!isDragging || gameState !== 'PLAYING') return;
        let deltaX = e.clientX - startX;
        targetRotation += deltaX * 0.01;
        startX = e.clientX;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    function update() {
        if (gameState === 'PLAYING') {
            rotationAngle += (targetRotation - rotationAngle) * 0.1;

            player.vy += player.gravity;
            player.y += player.vy;

            let centerX = GW / 2;
            let currentDiskIndex = Math.floor((player.y - 160) / 42);

            if (currentDiskIndex >= 0 && currentDiskIndex < disks.length) {
                let disk = disks[currentDiskIndex];
                if (!disk.broken) {
                    let playerAngle = Math.atan2(player.y - disk.y, player.x - centerX) - rotationAngle;
                    while (playerAngle < 0) playerAngle += Math.PI * 2;
                    while (playerAngle > Math.PI * 2) playerAngle -= Math.PI * 2;

                    let inGap = playerAngle >= disk.gapStart && playerAngle <= (disk.gapStart + disk.gapSize);

                    if (inGap && player.vy > 0) {
                        player.vy = player.jumpPower * 0.85;
                        score += 10;
                        scoreEl.innerText = score;
                        energy = Math.min(100, energy + 25);
                        energyFill.style.width = energy + '%';
                        playSound('bounce');
                    } else if (!inGap && player.y + player.size / 2 >= disk.y && player.y - player.size / 2 <= disk.y + 10) {
                        if (energy >= 100) {
                            disk.broken = true;
                            energy = 0;
                            energyFill.style.width = '0%';
                            player.vy = player.jumpPower;
                            score += 50;
                            scoreEl.innerText = score;
                            playSound('break');
                        } else {
                            if (player.vy > 0) {
                                player.y = disk.y - player.size / 2;
                                player.vy = player.jumpPower;
                                playSound('bounce');
                            }
                        }
                    }
                }
            }

            if (player.y > disks[disks.length - 1].y + 40) {
                score += 200;
                initLevel();
            }

            if (player.y > GH + 50) gameOver();
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, GW, GH);
        let centerX = GW / 2;

        // رسم الأعمدة والحلقات الحلزونية
        disks.forEach((disk) => {
            if (disk.broken) return;
            ctx.save();
            ctx.translate(centerX, disk.y);
            ctx.rotate(rotationAngle);

            ctx.beginPath();
            ctx.arc(0, 0, disk.radius, disk.gapStart + disk.gapSize, disk.gapStart + Math.PI * 2);
            ctx.lineWidth = 12;
            ctx.strokeStyle = disk.color;
            ctx.stroke();

            ctx.restore();
        });

        // رسم المكعب الأحمر العصبي (الشخصية الأساسية)
        ctx.save();
        ctx.translate(centerX, player.y);
        ctx.fillStyle = energy >= 100 ? '#ffeb3b' : '#ff3333';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 12;
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        
        // عيون المكعب الحادة
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-6, -4, 4, 4);
        ctx.fillRect(2, -4, 4, 4);
        ctx.restore();
    }

    update();
</script>
</body>
</html>
