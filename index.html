<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Helixdrix</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #150f29; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex; justify-content: center; align-items: center;
        }

        #game-container {
            position: relative;
            width: 100vw; height: 100vh;
            max-width: 450px;
            background: linear-gradient(to bottom, #2b1b4e, #150f29);
            display: flex; flex-direction: column; align-items: center;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(21, 15, 41, 0.96); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white; z-index: 20; text-align: center;
            padding: 20px;
        }
        .screen h1 { font-size: 38px; color: #ffeb3b; text-shadow: 2px 2px #ff5722; margin-bottom: 10px; }
        .btn {
            padding: 14px 45px; font-size: 22px; font-weight: bold; background-color: #00e676;
            color: #000; border: 3px solid #fff; border-radius: 35px; cursor: pointer;
            box-shadow: 0 6px 20px rgba(0,230,118,0.5);
        }

        #hud {
            position: absolute; top: 15px; left: 15px; right: 15px;
            display: flex; justify-content: space-between; align-items: center;
            color: white; font-size: 16px; font-weight: bold; z-index: 10; display: none;
            background: rgba(0, 0, 0, 0.4); padding: 8px 15px; border-radius: 12px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="start-screen" class="screen">
        <h1>HELIXDRIX</h1>
        <p style="margin-bottom: 25px; color: #ddd; font-size: 16px;">العب بالمكعب الأحمر وحطم البرج الحلزوني!</p>
        <button class="btn" onclick="startGame()">ابدأ اللعب</button>
    </div>

    <div id="gameover-screen" class="screen" style="display: none;">
        <h1 style="color: #ff5252;">انتهت اللعبة</h1>
        <p id="final-score" style="font-size: 22px; margin-bottom: 25px;">النتيجة: 3607</p>
        <button class="btn" onclick="startGame()">إعادة المحاولة</button>
    </div>

    <div id="hud">
        <div>النتيجة: <span id="score">3607</span></div>
        <div style="color: #ffeb3b;">⚡ طاقة</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        let now = audioCtx.currentTime;
        if (type === 'bounce') {
            osc.frequency.setValueAtTime(320, now);
            osc.frequency.exponentialRampToValueAtTime(650, now + 0.1);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
            osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'break') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'gameover') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.linearRampToValueAtTime(80, now + 0.4);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.4);
            osc.start(now); osc.stop(now + 0.4);
        }
    }

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');

    const GW = 400, GH = 750;
    canvas.width = GW;
    canvas.height = GH;

    let gameState = 'START';
    let score = 3607;
    let towerAngle = 0;
    let targetAngle = 0;

    let player = {
        x: GW / 2,
        y: 160,
        vy: 0,
        size: 24,
        gravity: 0.48,
        jumpPower: -8.8
    };

    let slices = [];

    function initLevel() {
        score = 3607;
        scoreEl.innerText = score;
        player.y = 140; player.vy = 0;
        
        slices = [];
        let totalSlices = 16;
        for (let i = 0; i < totalSlices; i++) {
            let parts = [];
            let gapIndex = Math.floor(Math.random() * 8);
            for (let p = 0; p < 8; p++) {
                if (p === gapIndex || p === (gapIndex + 1) % 8) {
                    parts.push({ active: false }); // فجوة للعبور
                } else {
                    parts.push({
                        active: true,
                        color: i === totalSlices - 1 ? '#00e676' : (i % 2 === 0 ? '#ff3b7a' : '#7b2cbf') // ألوان وردية وبنفسجية مطابقة للفيديو والصور
                    });
                }
            }
            slices.push({
                y: 220 + i * 28,
                parts: parts
            });
        }
    }

    function startGame() {
        initAudio();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('hud').style.display = 'flex';
        initLevel();
        gameState = 'PLAYING';
    }

    function gameOver() {
        playSound('gameover');
        gameState = 'GAMEOVER';
        document.getElementById('hud').style.display = 'none';
        document.getElementById('final-score').innerText = `النتيجة النهائية: ${score}`;
        document.getElementById('gameover-screen').style.display = 'flex';
    }

    // تدوير البرج بسلاسة عبر السحب بالإصبع يميناً ويساراً
    let isDragging = false, startX = 0;
    window.addEventListener('pointerdown', e => { isDragging = true; startX = e.clientX; });
    window.addEventListener('pointermove', e => {
        if (!isDragging || gameState !== 'PLAYING') return;
        targetAngle += (e.clientX - startX) * 0.012;
        startX = e.clientX;
    });
    window.addEventListener('pointerup', () => { isDragging = false; });

    function update() {
        if (gameState === 'PLAYING') {
            towerAngle += (targetAngle - towerAngle) * 0.15;
            player.vy += player.gravity;
            player.y += player.vy;

            let centerX = GW / 2;
            let currentSliceIdx = Math.floor((player.y - 200) / 28);

            if (currentSliceIdx >= 0 && currentSliceIdx < slices.length) {
                let slice = slices[currentSliceIdx];
                let hitAnyActive = false;

                let playerAngle = Math.atan2(player.y - slice.y, player.x - centerX) - towerAngle;
                while (playerAngle < 0) playerAngle += Math.PI * 2;
                while (playerAngle > Math.PI * 2) playerAngle -= Math.PI * 2;

                let partIndex = Math.floor((playerAngle / (Math.PI * 2)) * 8) % 8;
                if (slice.parts[partIndex] && slice.parts[partIndex].active) {
                    hitAnyActive = true;
                }

                if (hitAnyActive && player.vy > 0) {
                    player.y = slice.y - player.size / 2;
                    player.vy = player.jumpPower;
                    score += 12;
                    scoreEl.innerText = score;
                    playSound('bounce');
                    slice.parts[partIndex].active = false; // تحطيم القطعة
                }
            }

            if (player.y > slices[slices.length - 1].y + 50) {
                score += 400;
                initLevel();
            }

            if (player.y > GH + 60) gameOver();
        }
        draw();
        requestAnimationFrame(update);
    }

    function draw() {
        ctx.clearRect(0, 0, GW, GH);
        let centerX = GW / 2;

        // رسم البرج الأبيض المركزي تماماً مثل الفيديو
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(centerX - 16, 80, 32, GH - 80);

        // رسم الحلقات الدائرية المتدرجة
        slices.forEach((slice) => {
            ctx.save();
            ctx.translate(centerX, slice.y);
            ctx.rotate(towerAngle);

            let numParts = 8;
            let angleStep = (Math.PI * 2) / numParts;

            for (let i = 0; i < numParts; i++) {
                if (!slice.parts[i].active) continue;

                ctx.beginPath();
                ctx.arc(0, 0, 115, i * angleStep, (i + 1) * angleStep);
                ctx.lineTo(0, 0);
                ctx.fillStyle = slice.parts[i].color;
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.stroke();
            }
            ctx.restore();
        });

        // رسم المكعب الأحمر العصبي الخاص بك ذي العيون في المنتصف تماماً
        ctx.save();
        ctx.translate(centerX, player.y);
        ctx.fillStyle = '#ff3333';
        ctx.shadowColor = '#ff0000';
        ctx.shadowBlur = 15;
        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
        
        // رسم العيون الحادة للمكعب
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-7, -5, 5, 5);
        ctx.fillRect(2, -5, 5, 5);
        ctx.fillStyle = '#000000';
        ctx.fillRect(-5, -3, 2, 2);
        ctx.fillRect(4, -3, 2, 2);
        ctx.restore();
    }

    update();
</script>
</body>
</html>
